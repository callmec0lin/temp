<!DOCTYPE html>
<html>
<head>
    <title>Iframe Route Fuzzer</title>
    <style>
        body { font-family: monospace; padding: 15px; background: #111; color: #0f0; }
        .target-box { margin-bottom: 15px; border: 1px solid #444; padding: 10px; background: #1a1a1a; }
        iframe { width: 100%; height: 80px; border: 1px solid #0f0; background: #fff; }
    </style>
</head>
<body>
    <h2>Iframe-Based Internal Endpoint Fuzzer</h2>
    <div id="container"></div>

    <script>
        const baseUrl = 'http://127.0.0.1:31326';
        
        // List of potential paths and files to test
        const paths = [
            '/', '/flag', '/flag.txt', '/admin', '/api', '/debug', '/status', 
            '/robots.txt', '/source', '/file', '/files', '/download',
            '/config', '/env', '/secret', '/app.js', '/server.js', '/package.json'
        ];

        const container = document.getElementById('container');

        paths.forEach(path => {
            const target = baseUrl + path;
            
            // Create a wrapper box for each path
            const box = document.createElement('div');
            box.className = 'target-box';
            box.innerHTML = `<strong>Testing Path: ${path}</strong><br>`;
            
            // Create an iframe pointing directly to the internal endpoint
            const iframe = document.createElement('iframe');
            iframe.src = target;
            
            box.appendChild(iframe);
            container.appendChild(box);
        });
    </script>
</body>
</html>
